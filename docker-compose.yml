services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trawl
      POSTGRES_PASSWORD: trawl
      POSTGRES_DB: trawl
    ports: ["5432:5432"]
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - trawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trawl"]
      interval: 3s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15

  create-topics:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        for t in document.ingested chunk.embedded query.answered document.ingested.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        done

  crawler:
    build: ./services/ingestion
    profiles: ["ingest"]
    command: ["python", "-m", "app.crawler", "${REPO:-pallets/flask}"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://trawl:trawl@db:5432/trawl
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  embed-worker:
    build: ./services/ingestion
    profiles: ["ingest"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trawl:trawl@db:5432/trawl
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMBEDDING_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  trawl_pgdata:
