services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trawl
      POSTGRES_PASSWORD: trawl
      POSTGRES_DB: trawl
    ports: ["5432:5432"]
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - trawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trawl"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  trawl_pgdata:
